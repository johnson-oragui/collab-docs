name: Backend CI

on:
  pull_request:
    branches: ['main', 'develop']
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: 'username'
          POSTGRES_PASSWORD: 'password'
          POSTGRES_DB: 'postgres'
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U username -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:latest
        env:
          REDIS_URL: redis://localhost:6379
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Copy env file
        run: cp .env.sample .env

      - name: Install backend dependencies
        run: npm ci

      - name: Create application and test databases
        run: |
          node <<'NODE'
          const { Client } = require('pg');
          const fs = require('node:fs');

          async function createDatabases() {
            const client = new Client({
              host: process.env.DB_HOST,
              port: Number(process.env.DB_PORT),
              user: process.env.DB_USER,
              password: process.env.DB_PASSWORD,
              database: 'postgres',
            });

            await client.connect();

            try {
              const sql = fs.readFileSync(
                'test/fixture/setup/create-databases.sql',
                'utf8',
              );

              const statements = sql
                .split(';')
                .map(statement => statement.trim())
                .filter(Boolean);

              for (const statement of statements) {
                await client.query(statement);
              }

              console.log('Application and test databases created.');
            } finally {
              await client.end();
            }
          }

          createDatabases().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: username
          DB_PASSWORD: password

      

      - name: Run migrations
        run: npm run migration:run
        env:
          TEST: 'false'
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: username
          DB_PASSWORD: password
          DB_NAME: database
          TEST_DB_NAME: test
          REDIS_URL: redis://localhost:6379/0

      - name: Run tests
        run: npm test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: username
          DB_PASSWORD: password
          DB_NAME: database
          TEST_DB_NAME: test
          REDIS_URL: redis://localhost:6379/1
